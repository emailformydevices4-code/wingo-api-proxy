<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d16"><title>WinGo Forensic Console</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d16;color:#eef2f7;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:960px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:21px;margin:0}h1 span{color:#58a6ff}.status{padding:7px 10px;border:1px solid #26354a;border-radius:99px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#111927;border:1px solid #26354a;border-radius:14px;padding:15px}.label{color:#8fa0b5;font-size:10px;letter-spacing:.12em}.value{font-size:25px;font-weight:800;margin-top:6px;word-break:break-all}.sub{color:#8fa0b5;font-size:11px;margin-top:5px}h2{font-size:14px;margin:18px 0 8px}pre{white-space:pre-wrap;word-break:break-word;background:#0d1420;border:1px solid #26354a;padding:13px;border-radius:12px;max-height:500px;overflow:auto}.ok{color:#34d399}.bad{color:#fb7185}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.value{font-size:20px}.wide{grid-column:1/-1}}</style></head><body><main><div class="head"><h1>WinGo <span>Forensic Console</span></h1><div id="conn" class="status">CONNECTING…</div></div><div class="grid"><div class="card"><div class="label">LATEST ISSUE</div><div id="issue" class="value">—</div></div><div class="card"><div class="label">TARGET</div><div id="target" class="value">—</div></div><div class="card"><div class="label">PREDICTION</div><div id="pred" class="value">—</div><div id="predsub" class="sub">—</div></div><div class="card"><div class="label">RESEARCH STATUS</div><div id="state" class="value">—</div></div><div class="card"><div class="label">HISTORY</div><div id="count" class="value">—</div></div><div class="card"><div class="label">OOS EXACT</div><div id="exact" class="value">—</div><div id="oos" class="sub">—</div></div><div class="card wide"><div class="label">FORENSIC PAYLOAD</div><pre id="raw">Waiting for server…</pre></div></div><h2>Refresh: every 3 seconds · isolated gateway · existing services untouched</h2></main><script>
const $=id=>document.getElementById(id);
function pct(x){return Number.isFinite(Number(x))?(Number(x)*100).toFixed(2)+'%':'—'}
async function load(){
 try{
  const r=await fetch('/api/forensic?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const d=await r.json(),l=d.live||{},rows=l.rows||[],preds=l.pdf_predictions||[],target=String(l.target||'');
  const p=preds.find(x=>String(x.target_issue)===target)||preds[0]||null;
  const rs=d.research_api||{},rr=rs.research||{},runtime=rr.runtime||{};
  const o=runtime?.summary?.oos||{};
  $('conn').textContent=d.live_error?'LIVE API DEGRADED':'CONNECTED';$('conn').className='status '+(d.live_error?'bad':'ok');
  $('issue').textContent=l.source_current?.issueNumber||l.latest?.issue_number||'—';
  $('target').textContent=target||'—';
  $('pred').textContent=p?.pdf_ready&&p?.predicted_digit!=null?(p.predicted_digit+' / '+(p.predicted_side||'—')):'PDF NOT READY';
  $('predsub').textContent=p?.pdf_ready?('color: '+(p.predicted_color||'—')+' · context: '+(p.pdf_context||'—')):'No published PDF prediction for current target';
  $('state').textContent=rr.state?.status||l.transport||'LIVE';
  $('count').textContent=rows.length;
  $('exact').textContent=o.n?pct(o.exact):'—';
  $('oos').textContent=o.n?('n='+o.n+' · side='+pct(o.side)+' · near1='+pct(o.near1)):'Research OOS not available';
  $('raw').textContent=d.live_error
  ? 'LIVE API ERROR: '+d.live_error+'\n\nThe console is still alive. Diagnostics and research fallback are below.\n\n'+JSON.stringify(d,null,2)
  : JSON.stringify(d,null,2);
 }catch(e){
  $('conn').textContent='GATEWAY ERROR';$('conn').className='status bad';
  $('raw').textContent='Gateway request failed: '+(e.stack||String(e));
 }
}
load();setInterval(load,3000)
</script></body></html>
