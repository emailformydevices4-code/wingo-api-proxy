name: Frontend integrity patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prediction frontend
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'let S={rows:[],ledger:[],runtime:null,latest:null,target:null,current:null,busy:false};',
              'let S={rows:[],ledger:[],predictions:[],runtime:null,latest:null,target:null,current:null,busy:false,lastFetch:0};'
          )
          old = '''async function sync(){if(S.busy)return;S.busy=true;try{const [a,b,c]=await Promise.all([api("wingo_results","issue_number,result_digit,result_side,result_color,observed_at,source","order=issue_number.desc&limit=600"),api("wingo_three_engine_ledger","*","order=target_issue.desc&limit=500"),api("wingo_fusion_runtime","*","order=last_refresh_at.desc&limit=1")]);S.rows=a||[];S.ledger=b||[];S.runtime=c?.[0]||null;S.latest=S.rows[0]||null;S.target=next(S.latest?.issue_number);$("health").textContent="LIVE";$("health").className="tag good";main()}catch(e){$("health").textContent="OFFLINE";$("health").className="tag bad";toast(e.message)}finally{S.busy=false}}'''
          new = '''async function sync(){if(S.busy)return;S.busy=true;try{const [a,b,c,d]=await Promise.all([api("wingo_results","issue_number,result_digit,result_side,result_color,observed_at,source","order=issue_number.desc&limit=600"),api("wingo_three_engine_ledger","*","order=target_issue.desc&limit=500"),api("wingo_fusion_runtime","*","order=last_refresh_at.desc&limit=1"),api("wingo_predictions","target_issue,predicted_digit,predicted_side,pdf_ready,v71_side,v71_confidence,engine_version,created_at","order=created_at.desc&limit=500")]);S.rows=a||[];S.ledger=b||[];S.runtime=c?.[0]||null;S.predictions=d||[];S.latest=S.rows[0]||null;S.target=next(S.latest?.issue_number);S.lastFetch=Date.now();$("health").textContent="LIVE";$("health").className="tag good";main()}catch(e){$("health").textContent="OFFLINE";$("health").className="tag bad";toast(e.message)}finally{S.busy=false}}'''
          s = s.replace(old, new)
          old = 'const r=S.ledger.find(x=>String(x.target_issue)===String(S.target));S.current=r||null;showOutcome(r);'
          new = 'const r=S.ledger.find(x=>String(x.target_issue)===String(S.target));const pp=S.predictions.find(x=>String(x.target_issue)===String(S.target));S.current=r||null;const settled=[...S.ledger].filter(x=>x&&x.settled&&x.actual_digit!=null&&x.fusion_digit!=null).sort((a,b)=>String(b.target_issue).localeCompare(String(a.target_issue)));showOutcome(settled[0]||null);'
          s = s.replace(old, new)
          old = '''if(!r){$("dlabel").textContent="FUSION WAITING";$("fd").textContent="—";$("fd").className="digit abstain";$("fc").textContent="Waiting for the authoritative server decision.";$("fs").textContent=$("ag").textContent=$("pn").textContent="—";["pdfd","vside","vc","vr","vs","vg"].forEach(id=>$(id).textContent="—");$("pdfm").textContent="Waiting for authoritative PDF row."}'''
          new = '''if(!r){$("dlabel").textContent="FUSION WAITING";$("fd").textContent="—";$("fd").className="digit abstain";$("fc").textContent="Server fusion row is still being prepared for this target.";$("fs").textContent=$("ag").textContent=$("pn").textContent="—";$("pdfd").textContent=pp?.predicted_digit??"—";$("pdfm").innerHTML=pp?.pdf_ready?`PDF prediction ready · ${esc(pp.predicted_side||side(pp.predicted_digit))}<br>${esc(pp.engine_version||"server prediction")}`:"Waiting for authoritative PDF row.";$("vside").textContent=pp?.v71_side||"—";$("vc").textContent=pp?.v71_confidence!=null?pct(pp.v71_confidence):"—";$("vr").textContent=pp?"YES":"—";$("vs").textContent=pp?.engine_version||"—";$("vg").textContent="SERVER GATE"}'''
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix live prediction fallback and settlement animation [skip ci]'
          git push
