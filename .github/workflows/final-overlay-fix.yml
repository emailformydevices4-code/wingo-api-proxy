name: Final frontend overlay fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove page-wide blur from result overlay
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('background:rgba(15,23,42,.12);backdrop-filter:blur(2px)', 'background:rgba(2,8,20,.10)')
          s=s.replace('<title>WinGo Prediction Engine</title>', '<title>WinGo Prediction Engine · Live</title>')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix result overlay blur [skip ci]'
          git push
