name: Restore Live Fallback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore direct Supabase path with proxy fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          start=s.find('async function sync(){')
          end=s.find('function toast(',start)
          if start<0 or end<0:
              raise SystemExit('sync boundaries missing')
          new='''async function sync(){
            if(S.busy)return;
            S.busy=true;
            const load=async()=>{
              const [a,b,d]=await Promise.allSettled([
                api("wingo_results","issue_number,result_digit,result_side,result_color,observed_at,source","order=issue_number.desc&limit=12"),
                api("wingo_three_engine_ledger","target_issue,source_issue,sequence_id,gap_safe,data_quality,primary_digit,primary_side,primary_ready,pdf_digit,pdf_side,pdf_ready,pdf_source,v71_side,v71_confidence,v71_ready,v71_source,digit_agreement,side_agreement,fusion_digit,fusion_side,fusion_confidence,fusion_weights,fusion_meta,fusion_decision,settled,actual_digit,actual_side,updated_at","order=target_issue.desc&limit=30"),
                api("wingo_predictions","target_issue,predicted_digit,predicted_side,pdf_ready,engine_version,created_at","order=created_at.desc&limit=25")
              ]);
              let ok=0;
              if(a.status==='fulfilled'){S.rows=a.value||[];ok++}
              if(b.status==='fulfilled'){S.ledger=b.value||[];ok++}
              if(d.status==='fulfilled'){S.predictions=d.value||[];ok++}
              if(!ok)throw Error('Supabase unavailable');
              S.latest=S.rows[0]||S.latest;
              S.target=next(S.latest?.issue_number)||S.target;
              S.lastFetch=Date.now();
              $("health").textContent=ok===3?"LIVE":"DEGRADED";
              $("health").className="tag "+(ok===3?"good":"warnc");
              main();
              return ok===3;
            };
            try{
              let usedProxy=false;
              try{
                const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),1800);
                try{
                  const r=await fetch('/api/wingo/live?ts='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'},signal:ctl.signal});
                  if(!r.ok)throw Error('proxy '+r.status);
                  const x=await r.json();
                  if(!x||x.ok!==true)throw Error(x?.error||'proxy unavailable');
                  S.rows=Array.isArray(x.rows)?x.rows:[];
                  S.ledger=Array.isArray(x.ledger)?x.ledger:[];
                  S.predictions=Array.isArray(x.predictions)?x.predictions:[];
                  S.latest=x.latest||S.rows[0]||S.latest;
                  S.target=next(S.latest?.issue_number)||S.target;
                  S.lastFetch=Date.now();
                  $("health").textContent="LIVE";
                  $("health").className="tag good";
                  main();
                  usedProxy=true;
                }finally{clearTimeout(tm)}
              }catch(_){usedProxy=false}
              if(!usedProxy)await load();
            }catch(e){
              $("health").textContent=S.latest?"DEGRADED":"OFFLINE";
              $("health").className="tag "+(S.latest?"warnc":"bad");
              if(!S.latest)toast(e.name==='AbortError'?"Live request timed out":"Live sync unavailable");
            }finally{S.busy=false}
          }
          '''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          js=s.split('<script>\n',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/wingo.js').write_text(js)
          assert 'api("wingo_results"' in s
          assert "fetch('/api/wingo/live?ts='+Date.now()" in s
          PY
          node --check /tmp/wingo.js
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git rm -f .github/workflows/restore-live-fallback.yml
          git commit -m 'Restore working Supabase live path with proxy fallback [skip ci]'
          git push