name: Fix Supabase Live Timeout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-supabase-timeout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden live Supabase sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          start=s.find('async function sync(){')
          end=s.find('function toast(',start)
          if start<0 or end<0: raise SystemExit('sync boundaries not found')
          new='''async function sync(){if(S.busy)return;S.busy=true;try{const [a,b,d]=await Promise.allSettled([api("wingo_results","issue_number,result_digit,result_side,result_color,observed_at,source","order=issue_number.desc&limit=8"),api("wingo_three_engine_ledger","target_issue,source_issue,sequence_id,gap_safe,data_quality,primary_digit,primary_side,primary_ready,pdf_digit,pdf_side,pdf_ready,pdf_source,v71_side,v71_confidence,v71_ready,v71_source,digit_agreement,side_agreement,fusion_digit,fusion_side,fusion_confidence,fusion_weights,fusion_meta,fusion_decision,settled,actual_digit,actual_side,updated_at","order=target_issue.desc&limit=15"),api("wingo_predictions","target_issue,predicted_digit,predicted_side,pdf_ready,engine_version,created_at","order=created_at.desc&limit=15")]);let ok=0;if(a.status==='fulfilled'){S.rows=a.value||[];ok++}if(b.status==='fulfilled'){S.ledger=b.value||[];ok++}if(d.status==='fulfilled'){S.predictions=d.value||[];ok++}if(ok){S.latest=S.rows[0]||S.latest;S.target=next(S.latest?.issue_number)||S.target;S.lastFetch=Date.now();$("health").textContent=ok===3?"LIVE":"DEGRADED";$("health").className="tag "+(ok===3?"good":"warnc");main()}else{throw Error("Supabase unavailable")}}catch(e){$("health").textContent="OFFLINE";$("health").className="tag bad";if(!S.latest)toast(e.name==='AbortError'?"Supabase request timed out":"Live sync failed: "+e.message)}finally{S.busy=false}}\n'''
          s=s[:start]+new+s[end:]
          s=s.replace('fetchTimeout:9000','fetchTimeout:5000',1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          js=s.split('<script>\n',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/wingo.js').write_text(js)
          assert 'Promise.allSettled' in s
          assert 'limit=8' in s and 'limit=15' in s
          PY
          node --check /tmp/wingo.js
      - name: Commit and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git rm -f .github/workflows/fix-supabase-timeout.yml
          git commit -m 'Harden live Fusion against Supabase timeouts [skip ci]'
          git push
