name: Row speed patch

on:
  push:
    paths:
      - '.github/workflows/row-speed-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          a=s.find('.history-table{')
          b=s.find('.history-note{',a)
          if a<0 or b<0: raise SystemExit('history CSS markers missing')
          css='.history-table{margin-top:10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}.history-table::-webkit-scrollbar{display:none}.history-row{display:flex;gap:7px;min-width:max-content;padding:2px 1px 5px}.history-chip{width:82px;flex:0 0 82px;background:#0a1726;border:1px solid var(--l);border-radius:13px;padding:8px 6px;text-align:center}.history-chip .hi{font:800 7px ui-monospace,monospace;color:var(--m);margin-bottom:5px}.history-chip .nums{font-size:18px;font-weight:950;line-height:1}.history-chip .arr{color:var(--m);font-size:10px;margin:0 3px}.history-chip .hs{font-size:7px;font-weight:900;margin-top:5px;letter-spacing:.04em}.history-chip.win{border-color:#14532d}.history-chip.loss{border-color:#7f1d1d}.history-chip.abstain{border-color:#713f12}.winmark{color:var(--g);font-weight:950}.lossmark{color:var(--r);font-weight:950}.abstainmark{color:var(--a);font-weight:950}.digitpill{font-weight:950}'
          s=s[:a]+css+s[b:]

          a=s.find('function renderHistory10(){')
          b=s.find('function main(){',a)
          if a<0 or b<0: raise SystemExit('history function markers missing')
          fn='''function renderHistory10(){const host=$("history10");if(!host)return;const settled=[...S.ledger].filter(x=>x&&x.settled&&x.actual_digit!=null&&x.fusion_digit!=null).sort((a,b)=>String(b.target_issue).localeCompare(String(a.target_issue))).slice(0,10);if(!settled.length){host.innerHTML='<div class="sub">No settled fusion predictions yet.</div>';return}host.innerHTML='<div class="history-row">'+settled.map(x=>{const p=Number(x.fusion_digit),a=Number(x.actual_digit),ps=x.fusion_side||side(p),as=x.actual_side||side(a),win=ps===as,exact=p===a,decision=String(x.fusion_decision||'').toUpperCase(),cls=decision!=='PUBLISH'?'abstain':win?'win':'loss',label=decision!=='PUBLISH'?'ABSTAIN':exact?'DIGIT + SIDE WIN':win?ps+' WIN':'LOSS';return `<div class="history-chip ${cls}" title="Target ${esc(x.target_issue)} · predicted ${p} ${ps} · actual ${a} ${as}"><div class="hi">…${esc(String(x.target_issue).slice(-6))}</div><div class="nums"><span>${esc(p)}</span><span class="arr">→</span><span>${esc(a)}</span></div><div class="hs ${decision==='PUBLISH'?(win?'winmark':'lossmark'):'abstainmark'}">${esc(label)}</div></div>`}).join('')+'</div>'}'''
          s=s[:a]+fn+s[b:]

          a=s.find('async function sync(){')
          b=s.find('function toast(',a)
          if a<0 or b<0: raise SystemExit('sync function markers missing')
          fn='''async function sync(){if(S.busy)return;S.busy=true;try{const [a,b,d]=await Promise.all([api("wingo_results","issue_number,result_digit,result_side,result_color,observed_at,source","order=issue_number.desc&limit=12"),api("wingo_three_engine_ledger","*","order=target_issue.desc&limit=30"),api("wingo_predictions","target_issue,predicted_digit,predicted_side,pdf_ready,v71_side,v71_confidence,engine_version,created_at","order=created_at.desc&limit=25")]);S.rows=a||[];S.ledger=b||[];S.predictions=d||[];S.latest=S.rows[0]||null;S.target=next(S.latest?.issue_number);S.lastFetch=Date.now();$("health").textContent="LIVE";$("health").className="tag good";main()}catch(e){$("health").textContent="OFFLINE";$("health").className="tag bad";toast(e.message)}finally{S.busy=false}}
'''
          s=s[:a]+fn+s[b:]

          s,n=re.subn(r'setInterval\(clock,500\);setInterval\(sync,\d+\);sync\(\);clock\(\);','setInterval(clock,500);setInterval(sync,1000);sync();clock();',s,count=1)
          if n!=1: raise SystemExit('polling marker missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          js=s.split('<script>\n',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/wingo.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/wingo.js

      - name: Commit optimized frontend and remove patch workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git rm -f .github/workflows/row-speed-patch.yml .github/workflows/fast-row-performance.yml .github/workflows/final-overlay-fix.yml 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize frontend for lightning-fast results and compact history [skip ci]'
          git push