name: Live Proxy Fast Path
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-proxy-fast-path.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move live reads behind same-origin proxy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          route='''if(u.pathname==="/api/wingo/live"&&req.method==="GET"){\n  try{\n    if(!pool)return send(res,503,{ok:false,error:"database unavailable"});\n    const [a,b,c]=await Promise.all([\n      pool.query(`SELECT issue_number,result_digit,result_side,result_color,observed_at,source FROM public.wingo_results ORDER BY issue_number DESC LIMIT 8`),\n      pool.query(`SELECT target_issue,source_issue,sequence_id,gap_safe,data_quality,primary_digit,primary_side,primary_ready,pdf_digit,pdf_side,pdf_ready,pdf_source,v71_side,v71_confidence,v71_ready,v71_source,digit_agreement,side_agreement,fusion_digit,fusion_side,fusion_confidence,fusion_weights,fusion_meta,fusion_decision,settled,actual_digit,actual_side,updated_at FROM public.wingo_three_engine_ledger ORDER BY target_issue DESC LIMIT 15`),\n      pool.query(`SELECT target_issue,predicted_digit,predicted_side,pdf_ready,engine_version,created_at FROM public.wingo_predictions ORDER BY created_at DESC LIMIT 15`)\n    ]);\n    const rows=a.rows,ledger=b.rows,predictions=c.rows;\n    return send(res,200,{ok:true,latest:rows[0]||null,rows,ledger,predictions,serverAt:new Date().toISOString()});\n  }catch(e){return send(res,503,{ok:false,error:e.message})}\n}'''
          if '/api/wingo/live' not in s:
            needle='if(u.pathname==="/api/run"&&req.method==="GET")'
            if needle not in s: raise SystemExit('server route marker missing')
            s=s.replace(needle,route+needle,1)
          p.write_text(s)

          p=Path('public/index.html')
          s=p.read_text()
          start=s.find('async function sync(){')
          end=s.find('function toast(',start)
          if start<0 or end<0: raise SystemExit('frontend sync boundaries missing')
          new='''async function sync(){if(S.busy)return;S.busy=true;const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4500);try{const r=await fetch("/api/wingo/live?ts="+Date.now(),{cache:"no-store",headers:{Accept:"application/json"},signal:ctl.signal});if(!r.ok)throw Error("Live proxy HTTP "+r.status);const x=await r.json();if(!x.ok)throw Error(x.error||"Live proxy unavailable");S.rows=x.rows||[];S.ledger=x.ledger||[];S.predictions=x.predictions||[];S.latest=x.latest||S.rows[0]||S.latest;S.target=next(S.latest?.issue_number)||S.target;S.lastFetch=Date.now();$("health").textContent="LIVE";$("health").className="tag good";main()}catch(e){$("health").textContent=S.latest?"DEGRADED":"OFFLINE";$("health").className="tag "+(S.latest?"warnc":"bad");if(!S.latest)toast(e.name==='AbortError'?"Live proxy timed out":"Live sync unavailable")}finally{clearTimeout(tm);S.busy=false}}\n'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text();js=s.split('<script>\n',1)[1].rsplit('</script>',1)[0];Path('/tmp/wingo.js').write_text(js)
          assert 'fetch("/api/wingo/live?ts="+Date.now()' in s
          PY
          node --check /tmp/wingo.js
      - name: Commit and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/index.html
          git rm -f .github/workflows/live-proxy-fast-path.yml
          git commit -m 'Use same-origin live proxy for lightning-fast frontend sync [skip ci]'
          git push
